apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthai-deploy

spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthAI
  template:
    metadata:
      name: healthAI-pod
      labels:
        app: healthAI
    spec:
      containers:
        - name: healthai-container
          images: abhishekakurhade/healthai:7
          ports:
            - containerPort: 8501
        
        
